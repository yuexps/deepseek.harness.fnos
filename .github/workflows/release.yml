name: Build and Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布到 GitHub Release'
        required: false
        type: boolean
        default: true
      target_dsh_version:
        description: '指定 @deepseek-ai/dsh 版本'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  FNPACK_BIN: fnpack-1.2.3-linux-amd64
  BIN_NAME: deepseek.harness

jobs:
  build-runtime-amd64:
    name: Prepare NPM Runtime (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and Package DSH Runtime (amd64)
        run: |
          mkdir -p /tmp/runtime-dist
          cd /tmp/runtime-dist
          
          cat << 'EOF' > package.json
          {
            "name": "dsh-fnos-runtime",
            "version": "1.0.0",
            "private": true,
            "description": "DeepSeek Harness runtime for fnOS"
          }
          EOF

          TARGET_VER="${{ github.event.inputs.target_dsh_version }}"
          if [ -z "$TARGET_VER" ]; then
            TARGET_VER=$(node -e '
              const { execSync } = require("child_process");
              const raw = execSync("npm view @deepseek-ai/dsh versions --json", { encoding: "utf8" });
              const list = JSON.parse(raw);
              function parse(v) {
                const m = v.trim().replace(/^[v^~]/, "").match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/);
                if (!m) return null;
                return { maj: +m[1], min: +m[2], pat: +m[3], pre: m[4] ? m[4].split(".") : [] };
              }
              function cmp(a, b) {
                const p1 = parse(a), p2 = parse(b);
                if (!p1 || !p2) return a.localeCompare(b);
                if (p1.maj !== p2.maj) return p1.maj - p2.maj;
                if (p1.min !== p2.min) return p1.min - p2.min;
                if (p1.pat !== p2.pat) return p1.pat - p2.pat;
                if (!p1.pre.length && p2.pre.length) return 1;
                if (p1.pre.length && !p2.pre.length) return -1;
                const max = Math.max(p1.pre.length, p2.pre.length);
                for (let i = 0; i < max; i++) {
                  if (i >= p1.pre.length) return -1;
                  if (i >= p2.pre.length) return 1;
                  const s1 = p1.pre[i], s2 = p2.pre[i];
                  if (s1 === s2) continue;
                  const n1 = /^\d+$/.test(s1) ? +s1 : null, n2 = /^\d+$/.test(s2) ? +s2 : null;
                  if (n1 !== null && n2 !== null) return n1 - n2;
                  if (n1 !== null && n2 === null) return -1;
                  if (n1 === null && n2 !== null) return 1;
                  return s1.localeCompare(s2);
                }
                return 0;
              }
              list.sort(cmp);
              console.log(list[list.length - 1]);
            ')
          fi

          TARGET_PKG="@deepseek-ai/dsh@$TARGET_VER"
          echo "正在安装 amd64 官方 NPM 核心运行环境: $TARGET_PKG ..."
          npm install "$TARGET_PKG" --save --prefer-offline --no-audit --no-fund

          DSH_PKG_JSON="node_modules/@deepseek-ai/dsh/package.json"
          if [ ! -f "$DSH_PKG_JSON" ]; then
            echo "Error: 未找到 $DSH_PKG_JSON"
            exit 1
          fi

          INSTALLED_DSH_VER=$(node -p "require('./$DSH_PKG_JSON').version")
          echo "$INSTALLED_DSH_VER" > /tmp/version.txt
          echo "DSH amd64 NPM Version: $INSTALLED_DSH_VER"

          tar --numeric-owner -czf /tmp/deepseek-harness-amd64.tar.gz package.json package-lock.json node_modules

      - name: Upload amd64 Runtime Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-runtime-amd64
          path: |
            /tmp/deepseek-harness-amd64.tar.gz
            /tmp/version.txt

  build-runtime-arm64:
    name: Prepare NPM Runtime (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and Package DSH Runtime (arm64)
        run: |
          mkdir -p /tmp/runtime-dist
          cd /tmp/runtime-dist
          
          cat << 'EOF' > package.json
          {
            "name": "dsh-fnos-runtime",
            "version": "1.0.0",
            "private": true,
            "description": "DeepSeek Harness runtime for fnOS"
          }
          EOF

          TARGET_VER="${{ github.event.inputs.target_dsh_version }}"
          if [ -z "$TARGET_VER" ]; then
            TARGET_VER=$(node -e '
              const { execSync } = require("child_process");
              const raw = execSync("npm view @deepseek-ai/dsh versions --json", { encoding: "utf8" });
              const list = JSON.parse(raw);
              function parse(v) {
                const m = v.trim().replace(/^[v^~]/, "").match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/);
                if (!m) return null;
                return { maj: +m[1], min: +m[2], pat: +m[3], pre: m[4] ? m[4].split(".") : [] };
              }
              function cmp(a, b) {
                const p1 = parse(a), p2 = parse(b);
                if (!p1 || !p2) return a.localeCompare(b);
                if (p1.maj !== p2.maj) return p1.maj - p2.maj;
                if (p1.min !== p2.min) return p1.min - p2.min;
                if (p1.pat !== p2.pat) return p1.pat - p2.pat;
                if (!p1.pre.length && p2.pre.length) return 1;
                if (p1.pre.length && !p2.pre.length) return -1;
                const max = Math.max(p1.pre.length, p2.pre.length);
                for (let i = 0; i < max; i++) {
                  if (i >= p1.pre.length) return -1;
                  if (i >= p2.pre.length) return 1;
                  const s1 = p1.pre[i], s2 = p2.pre[i];
                  if (s1 === s2) continue;
                  const n1 = /^\d+$/.test(s1) ? +s1 : null, n2 = /^\d+$/.test(s2) ? +s2 : null;
                  if (n1 !== null && n2 !== null) return n1 - n2;
                  if (n1 !== null && n2 === null) return -1;
                  if (n1 === null && n2 !== null) return 1;
                  return s1.localeCompare(s2);
                }
                return 0;
              }
              list.sort(cmp);
              console.log(list[list.length - 1]);
            ')
          fi

          TARGET_PKG="@deepseek-ai/dsh@$TARGET_VER"
          echo "正在安装 arm64 官方 NPM 核心运行环境: $TARGET_PKG ..."
          npm install "$TARGET_PKG" --save --prefer-offline --no-audit --no-fund

          DSH_PKG_JSON="node_modules/@deepseek-ai/dsh/package.json"
          if [ ! -f "$DSH_PKG_JSON" ]; then
            echo "Error: 未找到 $DSH_PKG_JSON"
            exit 1
          fi

          INSTALLED_DSH_VER=$(node -p "require('./$DSH_PKG_JSON').version")
          echo "$INSTALLED_DSH_VER" > /tmp/version.txt
          echo "DSH arm64 NPM Version: $INSTALLED_DSH_VER"

          tar --numeric-owner -czf /tmp/deepseek-harness-arm64.tar.gz package.json package-lock.json node_modules

      - name: Upload arm64 Runtime Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-runtime-arm64
          path: |
            /tmp/deepseek-harness-arm64.tar.gz
            /tmp/version.txt

  build-and-release:
    name: Package and Release FPK
    needs: [build-runtime-amd64, build-runtime-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Download amd64 Runtime Artifact
        uses: actions/download-artifact@v4
        with:
          name: harness-runtime-amd64
          path: /tmp/amd64-dist

      - name: Download arm64 Runtime Artifact
        uses: actions/download-artifact@v4
        with:
          name: harness-runtime-arm64
          path: /tmp/arm64-dist

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Compile Go Binaries (amd64 & arm64)
        run: |
          mkdir -p /tmp/gobins
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/gobins/${{ env.BIN_NAME }}-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/gobins/${{ env.BIN_NAME }}-arm64 .

      - name: Build All FPK Packages (Parallel)
        run: |
          # 1. 打包 x86 离线安装包（匹配 amd64 原生模块）
          (
            mkdir -p fnpack_x86/app/bin
            cp -r fnpack/* fnpack_x86/
            cp /tmp/amd64-dist/version.txt fnpack_x86/app/.version
            cp /tmp/amd64-dist/deepseek-harness-amd64.tar.gz fnpack_x86/app/deepseek-harness.tar.gz
            cp /tmp/gobins/${{ env.BIN_NAME }}-amd64 fnpack_x86/app/bin/${{ env.BIN_NAME }}
            cd fnpack_x86
            chmod +x ${{ env.FNPACK_BIN }}
            ./${{ env.FNPACK_BIN }} build
            cd ..
            mv fnpack_x86/${{ env.BIN_NAME }}.fpk ./${{ env.BIN_NAME }}-x86.fpk
            rm -rf fnpack_x86
            echo "x86 FPK built successfully."
          ) &
          PID_X86=$!

          # 2. 打包 ARM 离线安装包（匹配 arm64 原生模块）
          (
            mkdir -p fnpack_arm/app/bin
            cp -r fnpack/* fnpack_arm/
            cp /tmp/arm64-dist/version.txt fnpack_arm/app/.version
            cp /tmp/arm64-dist/deepseek-harness-arm64.tar.gz fnpack_arm/app/deepseek-harness.tar.gz
            cp /tmp/gobins/${{ env.BIN_NAME }}-arm64 fnpack_arm/app/bin/${{ env.BIN_NAME }}
            sed -i 's/platform[[:space:]]*=[[:space:]]*x86/platform              = arm/g' fnpack_arm/manifest
            cd fnpack_arm
            chmod +x ${{ env.FNPACK_BIN }}
            ./${{ env.FNPACK_BIN }} build
            cd ..
            mv fnpack_arm/${{ env.BIN_NAME }}.fpk ./${{ env.BIN_NAME }}-arm.fpk
            rm -rf fnpack_arm
            echo "ARM FPK built successfully."
          ) &
          PID_ARM=$!

          FAIL=0
          for pid in $PID_X86 $PID_ARM; do
            wait $pid || FAIL=1
          done

          if [ $FAIL -ne 0 ]; then
            echo "Error: One or more FPK build tasks failed."
            exit 1
          fi

      - name: Extract Manifest Version
        id: manifest
        run: |
          APP_VER=$(grep -E '^[[:space:]]*version[[:space:]]*=' fnpack/manifest | awk -F'=' '{gsub(/[ \t]/,"",$2); print $2}')
          UPSTREAM_VER=$(cat /tmp/amd64-dist/version.txt 2>/dev/null || echo "latest")
          echo "version=$APP_VER" >> $GITHUB_OUTPUT
          echo "upstream_ver=$UPSTREAM_VER" >> $GITHUB_OUTPUT
          echo "Release version: $APP_VER, Upstream version: $UPSTREAM_VER"

      - name: Upload x86 FPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-x86
          path: ./${{ env.BIN_NAME }}-x86.fpk
          if-no-files-found: error

      - name: Upload ARM FPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-arm
          path: ./${{ env.BIN_NAME }}-arm.fpk
          if-no-files-found: error

      - name: Generate Changelog and Release Body
        run: |
          CURR_TAG="v${{ steps.manifest.outputs.version }}"
          
          git fetch --tags --force 2>/dev/null || true
          PREV_TAG=$(git tag -l "v*" --sort=-v:refname | grep -E '^v[0-9]' | grep -v "^${CURR_TAG}$" | head -n 1)
          
          echo "Current Tag: $CURR_TAG"
          echo "Previous Tag: $PREV_TAG"
          
          {
            echo "### 安装包说明"
            echo ""
            echo "| 文件名 | 架构 | 说明 |"
            echo "| :--- | :---: | :--- |"
            echo "| \`deepseek.harness-x86.fpk\` | x86_64 | 内置运行环境与管理前端，开箱即用。 |"
            echo "| \`deepseek.harness-arm.fpk\` | ARM64 | 内置运行环境与管理前端，开箱即用。 |"
            echo ""
            echo "---"
            echo "- 应用版本：\`${CURR_TAG}\`"
            echo "- DSH 版本：\`v${{ steps.manifest.outputs.upstream_ver }}\`"
            echo ""
            echo "### 更新日志"
            echo ""
          } > release_body.md

          HAS_COMMITS=0
          if [ -n "$PREV_TAG" ]; then
            if [ -n "$(git log "${PREV_TAG}..HEAD" --no-merges --oneline)" ]; then
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"* %s (%h)" >> release_body.md
              HAS_COMMITS=1
            fi
          else
            if [ -n "$(git log HEAD --no-merges --oneline)" ]; then
              git log HEAD --no-merges --pretty=format:"* %s (%h)" -n 20 >> release_body.md
              HAS_COMMITS=1
            fi
          fi
          
          if [ $HAS_COMMITS -eq 0 ]; then
            echo "* 维护与细节优化" >> release_body.md
          fi

          if [ -n "$PREV_TAG" ]; then
            echo "" >> release_body.md
            echo "" >> release_body.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURR_TAG}" >> release_body.md
          fi

          echo "Generated release body:"
          cat release_body.md

      - name: Delete Existing Release and Tag (if exists)
        if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.manifest.outputs.version }}"
          echo "Checking if release $TAG_NAME already exists..."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG_NAME..."
            gh release delete "$TAG_NAME" --yes --cleanup-tag || true
          fi
          git push --delete origin "$TAG_NAME" 2>/dev/null || true
          git tag -d "$TAG_NAME" 2>/dev/null || true

      - name: Create GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.manifest.outputs.version }}"
          name: "Release v${{ steps.manifest.outputs.version }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          make_latest: true
          preserve_order: true
          files: |
            ${{ env.BIN_NAME }}-x86.fpk
            ${{ env.BIN_NAME }}-arm.fpk

      - name: Update FnDepot fnpack.json
        if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VERSION: ${{ steps.manifest.outputs.version }}
          TAG_NAME: v${{ steps.manifest.outputs.version }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "未配置 GH_PAT secret，跳过更新 FnDepot。"
            exit 0
          fi

          X86_SIZE=$(stat -c %s "${{ env.BIN_NAME }}-x86.fpk")
          ARM_SIZE=$(stat -c %s "${{ env.BIN_NAME }}-arm.fpk")
          X86_SHA256=$(sha256sum "${{ env.BIN_NAME }}-x86.fpk" | awk '{print $1}')
          ARM_SHA256=$(sha256sum "${{ env.BIN_NAME }}-arm.fpk" | awk '{print $1}')
          
          X86_URL="https://github.com/yuexps/deepseek.harness.fnos/releases/download/${TAG_NAME}/${{ env.BIN_NAME }}-x86.fpk"
          ARM_URL="https://github.com/yuexps/deepseek.harness.fnos/releases/download/${TAG_NAME}/${{ env.BIN_NAME }}-arm.fpk"
          
          TARGET_REPOS=("yuexps/FnDepot")

          for REPO in "${TARGET_REPOS[@]}"; do
            echo "----------------------------------------"
            echo "Processing: $REPO"
            REPO_DIR="repo_$(echo "$REPO" | tr '/' '_')"
            
            git clone "https://x-access-token:${GH_PAT}@github.com/${REPO}.git" "$REPO_DIR" || {
              echo "::warning::Clone $REPO failed, skipping."
              continue
            }
            
            pushd "$REPO_DIR" > /dev/null
            
            if [ -f "fnpack.json" ]; then
              jq --arg ver "$VERSION" \
                 --arg x86_url "$X86_URL" \
                 --arg x86_sha "$X86_SHA256" \
                 --argjson x86_size "$X86_SIZE" \
                 --arg arm_url "$ARM_URL" \
                 --arg arm_sha "$ARM_SHA256" \
                 --argjson arm_size "$ARM_SIZE" \
                 '
                 .apps["deepseek.harness"].releases[$ver] = {
                   "packages": {
                     "x86": {
                       "download_url": $x86_url,
                       "sha256": $x86_sha,
                       "size": $x86_size
                     },
                     "arm": {
                       "download_url": $arm_url,
                       "sha256": $arm_sha,
                       "size": $arm_size
                     }
                   }
                 }
                 ' fnpack.json > fnpack.json.tmp && mv fnpack.json.tmp fnpack.json
                 
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              
              git add fnpack.json
              if ! git diff --staged --quiet; then
                git commit -m "chore: bump deepseek.harness to ${VERSION}"
                BRANCH=$(git rev-parse --abbrev-ref HEAD)
                git push "https://x-access-token:${GH_PAT}@github.com/${REPO}.git" "$BRANCH"
                echo "Successfully updated $REPO ($BRANCH)"
              else
                echo "No changes detected in $REPO."
              fi
            else
              echo "::warning::fnpack.json not found in $REPO."
            fi
            
            popd > /dev/null
          done
