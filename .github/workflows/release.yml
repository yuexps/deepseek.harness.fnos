name: Build and Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布到 GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  FNPACK_BIN: fnpack-1.2.3-linux-amd64
  BIN_NAME: deepseek.harness

jobs:
  build-harness-amd64:
    name: Prebuild Harness (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install System Dependencies
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /etc/apt/sources.list /etc/apt/apt-mirrors.txt
          ARCH=$(dpkg --print-architecture)
          if [ "$ARCH" = "arm64" ]; then
            MIRROR_URL="http://ports.ubuntu.com/ubuntu-ports/"
            SEC_URL="http://ports.ubuntu.com/ubuntu-ports/"
          else
            MIRROR_URL="http://archive.ubuntu.com/ubuntu/"
            SEC_URL="http://security.ubuntu.com/ubuntu/"
          fi
          sudo tee /etc/apt/sources.list.d/ubuntu.sources <<EOF
          Types: deb
          URIs: $MIRROR_URL
          Suites: noble noble-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: $SEC_URL
          Suites: noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update -o Acquire::http::Timeout="10" -o Acquire::Retries="2"
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Clone Upstream Harness
        run: |
          mkdir -p /tmp/upstream
          git clone --depth=1 https://github.com/deepseek-ai/deepseek-harness.git /tmp/upstream/deepseek-harness
          cd /tmp/upstream/deepseek-harness
          UPSTREAM_VER=$(node -p "require('./package.json').version")
          echo "$UPSTREAM_VER" > /tmp/version.txt
          echo "Upstream deepseek-harness version: $UPSTREAM_VER"
          git sparse-checkout set packages apps vendor native patches scripts website

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-harness-${{ hashFiles('/tmp/upstream/deepseek-harness/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-harness-

      - name: Prebuild Upstream Harness (amd64)
        run: |
          cd /tmp/upstream/deepseek-harness
          pnpm install --no-frozen-lockfile
          pnpm run build:official
          cd native/landlock-run
          pnpm run build:native
          cd ../..
          
          find . -name "*.tsbuildinfo" -delete
          
          # 动态闭包剪枝：递归分析依赖图，清理未被引用的 dev 模块与冗余子包
          node - <<'NODE'
          const fs = require('fs'), path = require('path')
          function readP(p) { try { return JSON.parse(fs.readFileSync(p, 'utf8')) } catch { return null } }
          const allMembers = new Map()
          function collect(dir) {
            if (!fs.existsSync(dir)) return
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              if (!e.isDirectory() || e.name === 'node_modules' || e.name === '.git' ||
                  e.name === 'fixtures' || e.name === 'tests') continue
              const sub = path.join(dir, e.name)
              const pj = path.join(sub, 'package.json')
              if (fs.existsSync(pj)) {
                const p = readP(pj)
                if (p && p.name) allMembers.set(p.name, sub)
              }
              collect(sub)
            }
          }
          for (const r of ['packages', 'apps', 'vendor', 'native']) collect(r)

          const used = new Set()
          function visit(name) {
            if (used.has(name)) return
            used.add(name)
            const dir = allMembers.get(name)
            if (!dir) return
            const p = readP(path.join(dir, 'package.json'))
            if (!p) return
            for (const k of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
              if (!p[k]) continue
              for (const dep in p[k]) if (allMembers.has(dep)) visit(dep)
            }
          }
          visit('@deepseek-ai/dsh')

          let removed = 0
          for (const [name, dir] of allMembers) {
            if (used.has(name)) continue
            if (dir.includes('/fixtures/') || dir.includes('/tests/')) continue
            if (name.includes('landlock-run-workspace') || dir.startsWith('native/landlock-run/packages/')) continue
            fs.rmSync(dir, { recursive: true, force: true })
            removed++
            console.log('rm unused member:', dir, '[' + name + ']')
          }
          console.log('removed ' + removed + ' unused workspace members')
          NODE
          
          # 清理根和保留 member 的 scripts 与 devDependencies
          node - <<'NODE'
          const fs = require('fs'), path = require('path')
          {
            const p = './package.json'
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'))
            pkg.scripts = {}
            delete pkg.devDependencies
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n')
          }
          function stripMember(dir) {
            if (!fs.existsSync(dir)) return
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              if (!e.isDirectory() || e.name === 'node_modules' || e.name === '.git') continue
              const sub = path.join(dir, e.name)
              const pj = path.join(sub, 'package.json')
              if (fs.existsSync(pj)) {
                const pkg = JSON.parse(fs.readFileSync(pj, 'utf8'))
                let touched = false
                if (pkg.scripts && Object.keys(pkg.scripts).length) { pkg.scripts = {}; touched = true }
                if (pkg.devDependencies) { delete pkg.devDependencies; touched = true }
                if (touched) fs.writeFileSync(pj, JSON.stringify(pkg, null, 2) + '\n')
              }
              stripMember(sub)
            }
          }
          for (const root of ['packages', 'apps', 'vendor']) stripMember(root)
          NODE
          
          # 重装纯生产依赖（仅为核心闭包安装依赖）
          rm -rf node_modules
          CI=true pnpm install --prod \
            --no-frozen-lockfile \
            --config.confirmModulesPurge=false \
            --config.dangerouslyAllowAllBuilds=true \
            --config.minimumReleaseAge=0 \
            --config.strictDepBuilds=false
          
          node packages/subprocess/subprocess-local/scripts/ensure-spawn-helper.mjs || true
          
          cd /tmp/upstream
          tar --numeric-owner -czf /tmp/deepseek-harness-amd64.tar.gz deepseek-harness

      - name: Upload amd64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-amd64
          path: |
            /tmp/deepseek-harness-amd64.tar.gz
            /tmp/version.txt

  build-harness-arm64:
    name: Prebuild Harness (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install System Dependencies
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /etc/apt/sources.list /etc/apt/apt-mirrors.txt
          ARCH=$(dpkg --print-architecture)
          if [ "$ARCH" = "arm64" ]; then
            MIRROR_URL="http://ports.ubuntu.com/ubuntu-ports/"
            SEC_URL="http://ports.ubuntu.com/ubuntu-ports/"
          else
            MIRROR_URL="http://archive.ubuntu.com/ubuntu/"
            SEC_URL="http://security.ubuntu.com/ubuntu/"
          fi
          sudo tee /etc/apt/sources.list.d/ubuntu.sources <<EOF
          Types: deb
          URIs: $MIRROR_URL
          Suites: noble noble-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: $SEC_URL
          Suites: noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update -o Acquire::http::Timeout="10" -o Acquire::Retries="2"
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Clone Upstream Harness
        run: |
          mkdir -p /tmp/upstream
          git clone --depth=1 https://github.com/deepseek-ai/deepseek-harness.git /tmp/upstream/deepseek-harness
          cd /tmp/upstream/deepseek-harness
          git sparse-checkout set packages apps vendor native patches scripts website

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-harness-${{ hashFiles('/tmp/upstream/deepseek-harness/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-harness-

      - name: Prebuild Upstream Harness (arm64)
        run: |
          cd /tmp/upstream/deepseek-harness
          pnpm install --no-frozen-lockfile
          pnpm run build:official
          cd native/landlock-run
          pnpm run build:native
          cd ../..
          
          find . -name "*.tsbuildinfo" -delete
          
          node - <<'NODE'
          const fs = require('fs'), path = require('path')
          function readP(p) { try { return JSON.parse(fs.readFileSync(p, 'utf8')) } catch { return null } }
          const allMembers = new Map()
          function collect(dir) {
            if (!fs.existsSync(dir)) return
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              if (!e.isDirectory() || e.name === 'node_modules' || e.name === '.git' ||
                  e.name === 'fixtures' || e.name === 'tests') continue
              const sub = path.join(dir, e.name)
              const pj = path.join(sub, 'package.json')
              if (fs.existsSync(pj)) {
                const p = readP(pj)
                if (p && p.name) allMembers.set(p.name, sub)
              }
              collect(sub)
            }
          }
          for (const r of ['packages', 'apps', 'vendor', 'native']) collect(r)

          const used = new Set()
          function visit(name) {
            if (used.has(name)) return
            used.add(name)
            const dir = allMembers.get(name)
            if (!dir) return
            const p = readP(path.join(dir, 'package.json'))
            if (!p) return
            for (const k of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
              if (!p[k]) continue
              for (const dep in p[k]) if (allMembers.has(dep)) visit(dep)
            }
          }
          visit('@deepseek-ai/dsh')

          let removed = 0
          for (const [name, dir] of allMembers) {
            if (used.has(name)) continue
            if (dir.includes('/fixtures/') || dir.includes('/tests/')) continue
            if (name.includes('landlock-run-workspace') || dir.startsWith('native/landlock-run/packages/')) continue
            fs.rmSync(dir, { recursive: true, force: true })
            removed++
            console.log('rm unused member:', dir, '[' + name + ']')
          }
          console.log('removed ' + removed + ' unused workspace members')
          NODE
          
          node - <<'NODE'
          const fs = require('fs'), path = require('path')
          {
            const p = './package.json'
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'))
            pkg.scripts = {}
            delete pkg.devDependencies
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n')
          }
          function stripMember(dir) {
            if (!fs.existsSync(dir)) return
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              if (!e.isDirectory() || e.name === 'node_modules' || e.name === '.git') continue
              const sub = path.join(dir, e.name)
              const pj = path.join(sub, 'package.json')
              if (fs.existsSync(pj)) {
                const pkg = JSON.parse(fs.readFileSync(pj, 'utf8'))
                let touched = false
                if (pkg.scripts && Object.keys(pkg.scripts).length) { pkg.scripts = {}; touched = true }
                if (pkg.devDependencies) { delete pkg.devDependencies; touched = true }
                if (touched) fs.writeFileSync(pj, JSON.stringify(pkg, null, 2) + '\n')
              }
              stripMember(sub)
            }
          }
          for (const root of ['packages', 'apps', 'vendor']) stripMember(root)
          NODE
          
          rm -rf node_modules
          CI=true pnpm install --prod \
            --no-frozen-lockfile \
            --config.confirmModulesPurge=false \
            --config.dangerouslyAllowAllBuilds=true \
            --config.minimumReleaseAge=0 \
            --config.strictDepBuilds=false
          
          node packages/subprocess/subprocess-local/scripts/ensure-spawn-helper.mjs || true
          
          cd /tmp/upstream
          tar --numeric-owner -czf /tmp/deepseek-harness-arm64.tar.gz deepseek-harness

      - name: Upload arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-arm64
          path: /tmp/deepseek-harness-arm64.tar.gz

  build-and-release:
    name: Package and Release
    needs: [build-harness-amd64, build-harness-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download amd64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: harness-amd64
          path: /tmp/amd64-dist

      - name: Download arm64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: harness-arm64
          path: /tmp/arm64-dist

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Compile Go Binaries
        run: |
          mkdir -p /tmp/gobins
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/gobins/${{ env.BIN_NAME }}-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/gobins/${{ env.BIN_NAME }}-arm64 .

      - name: Build All FPK Packages (Parallel)
        run: |
          # 1. x86 预构建版
          (
            mkdir -p fnpack_x86/app/bin
            cp -r fnpack/* fnpack_x86/
            rm -f fnpack_x86/app/bin/skill/bin/trim-cli-linux-arm64
            cp /tmp/amd64-dist/version.txt fnpack_x86/app/.version
            cp /tmp/amd64-dist/deepseek-harness-amd64.tar.gz fnpack_x86/app/deepseek-harness.tar.gz
            cp /tmp/gobins/${{ env.BIN_NAME }}-amd64 fnpack_x86/app/bin/${{ env.BIN_NAME }}
            cd fnpack_x86
            chmod +x ${{ env.FNPACK_BIN }}
            ./${{ env.FNPACK_BIN }} build
            cd ..
            mv fnpack_x86/${{ env.BIN_NAME }}.fpk ./${{ env.BIN_NAME }}-x86.fpk
            rm -rf fnpack_x86
            echo "x86 FPK built successfully."
          ) &
          PID_X86=$!

          # 2. arm 预构建版
          (
            mkdir -p fnpack_arm/app/bin
            cp -r fnpack/* fnpack_arm/
            rm -f fnpack_arm/app/bin/skill/bin/trim-cli-linux-x64
            cp /tmp/amd64-dist/version.txt fnpack_arm/app/.version
            cp /tmp/arm64-dist/deepseek-harness-arm64.tar.gz fnpack_arm/app/deepseek-harness.tar.gz
            cp /tmp/gobins/${{ env.BIN_NAME }}-arm64 fnpack_arm/app/bin/${{ env.BIN_NAME }}
            sed -i 's/platform[[:space:]]*=[[:space:]]*x86/platform              = arm/g' fnpack_arm/manifest
            cd fnpack_arm
            chmod +x ${{ env.FNPACK_BIN }}
            ./${{ env.FNPACK_BIN }} build
            cd ..
            mv fnpack_arm/${{ env.BIN_NAME }}.fpk ./${{ env.BIN_NAME }}-arm.fpk
            rm -rf fnpack_arm
            echo "ARM FPK built successfully."
          ) &
          PID_ARM=$!

          FAIL=0
          for pid in $PID_X86 $PID_ARM; do
            wait $pid || FAIL=1
          done

          if [ $FAIL -ne 0 ]; then
            echo "Error: One or more FPK build tasks failed."
            exit 1
          fi

      - name: Extract Manifest Version
        id: manifest
        run: |
          APP_VER=$(grep -E '^[[:space:]]*version[[:space:]]*=' fnpack/manifest | awk -F'=' '{gsub(/[ \t]/,"",$2); print $2}')
          UPSTREAM_VER=$(cat /tmp/amd64-dist/version.txt 2>/dev/null || echo "latest")
          echo "version=$APP_VER" >> $GITHUB_OUTPUT
          echo "upstream_ver=$UPSTREAM_VER" >> $GITHUB_OUTPUT
          echo "Release version: $APP_VER, Upstream version: $UPSTREAM_VER"

      - name: Upload x86 FPK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-x86
          path: ./${{ env.BIN_NAME }}-x86.fpk
          if-no-files-found: error

      - name: Upload ARM FPK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-arm
          path: ./${{ env.BIN_NAME }}-arm.fpk
          if-no-files-found: error

      - name: Generate Changelog and Release Body
        run: |
          CURR_TAG="v${{ steps.manifest.outputs.version }}"
          
          # 确保拉取完整 tags
          git fetch --tags --force 2>/dev/null || true
          
          # 查找上一个语义化版本 tag（排除当前 tag）
          PREV_TAG=$(git tag -l "v*" --sort=-v:refname | grep -E '^v[0-9]' | grep -v "^${CURR_TAG}$" | head -n 1)
          
          echo "Current Tag: $CURR_TAG"
          echo "Previous Tag: $PREV_TAG"
          
          # 写入 Release 基础信息
          {
            echo "### 安装包说明"
            echo ""
            echo "| 文件名 | 架构 | 说明 |"
            echo "| :--- | :---: | :--- |"
            echo "| \`deepseek.harness-x86.fpk\` | x86_64 | 预构建完整离线包，内置前端产物、后端文件及完整依赖，安装后极速秒级启动。 |"
            echo "| \`deepseek.harness-arm.fpk\` | ARM64 | 预构建完整离线包，内置前端产物、后端文件及完整依赖，安装后极速秒级启动。 |"
            echo ""
            echo "---"
            echo "- 应用版本：\`${CURR_TAG}\`"
            echo "- 上游源码版本：\`${{ steps.manifest.outputs.upstream_ver }}\`"
            echo ""
            echo "### 更新日志"
            echo ""
          } > release_body.md

          HAS_COMMITS=0
          if [ -n "$PREV_TAG" ]; then
            if [ -n "$(git log "${PREV_TAG}..HEAD" --no-merges --oneline)" ]; then
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"* %s (%h)" >> release_body.md
              HAS_COMMITS=1
            fi
          else
            if [ -n "$(git log HEAD --no-merges --oneline)" ]; then
              git log HEAD --no-merges --pretty=format:"* %s (%h)" -n 20 >> release_body.md
              HAS_COMMITS=1
            fi
          fi
          
          if [ $HAS_COMMITS -eq 0 ]; then
            echo "* 维护与细节优化" >> release_body.md
          fi

          if [ -n "$PREV_TAG" ]; then
            echo "" >> release_body.md
            echo "" >> release_body.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURR_TAG}" >> release_body.md
          fi

          echo "Generated release body:"
          cat release_body.md

      - name: Delete Existing Release and Tag (if exists)
        if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.manifest.outputs.version }}"
          echo "Checking if release $TAG_NAME already exists..."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG_NAME..."
            gh release delete "$TAG_NAME" --yes --cleanup-tag || true
          fi
          git push --delete origin "$TAG_NAME" 2>/dev/null || true
          git tag -d "$TAG_NAME" 2>/dev/null || true

      - name: Create GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.manifest.outputs.version }}"
          name: "Release v${{ steps.manifest.outputs.version }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ${{ env.BIN_NAME }}-x86.fpk
            ${{ env.BIN_NAME }}-arm.fpk

      - name: Update FnDepot fnpack.json
        if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VERSION: ${{ steps.manifest.outputs.version }}
          TAG_NAME: v${{ steps.manifest.outputs.version }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "未配置 GH_PAT secret，跳过更新 FnDepot。"
            exit 0
          fi

          # 计算安装包字节大小与 sha256
          X86_SIZE=$(stat -c %s "${{ env.BIN_NAME }}-x86.fpk")
          ARM_SIZE=$(stat -c %s "${{ env.BIN_NAME }}-arm.fpk")
          X86_SHA256=$(sha256sum "${{ env.BIN_NAME }}-x86.fpk" | awk '{print $1}')
          ARM_SHA256=$(sha256sum "${{ env.BIN_NAME }}-arm.fpk" | awk '{print $1}')
          
          # 构造下载链接
          X86_URL="https://github.com/yuexps/deepseek.harness.fnos/releases/download/${TAG_NAME}/${{ env.BIN_NAME }}-x86.fpk"
          ARM_URL="https://github.com/yuexps/deepseek.harness.fnos/releases/download/${TAG_NAME}/${{ env.BIN_NAME }}-arm.fpk"
          
          # 待同步更新的目标仓库列表
          TARGET_REPOS=("yuexps/FnDepot")

          for REPO in "${TARGET_REPOS[@]}"; do
            echo "----------------------------------------"
            echo "Processing: $REPO"
            REPO_DIR="repo_$(echo "$REPO" | tr '/' '_')"
            
            git clone "https://x-access-token:${GH_PAT}@github.com/${REPO}.git" "$REPO_DIR" || {
              echo "::warning::Clone $REPO failed, skipping."
              continue
            }
            
            pushd "$REPO_DIR" > /dev/null
            
            if [ -f "fnpack.json" ]; then
              jq --arg ver "$VERSION" \
                 --arg x86_url "$X86_URL" \
                 --arg x86_sha "$X86_SHA256" \
                 --argjson x86_size "$X86_SIZE" \
                 --arg arm_url "$ARM_URL" \
                 --arg arm_sha "$ARM_SHA256" \
                 --argjson arm_size "$ARM_SIZE" \
                 '
                 .apps["deepseek.harness"].releases[$ver] = {
                   "packages": {
                     "x86": {
                       "download_url": $x86_url,
                       "sha256": $x86_sha,
                       "size": $x86_size
                     },
                     "arm": {
                       "download_url": $arm_url,
                       "sha256": $arm_sha,
                       "size": $arm_size
                     }
                   }
                 }
                 ' fnpack.json > fnpack.json.tmp && mv fnpack.json.tmp fnpack.json
                 
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              
              git add fnpack.json
              if ! git diff --staged --quiet; then
                git commit -m "chore: bump deepseek.harness to ${VERSION}"
                BRANCH=$(git rev-parse --abbrev-ref HEAD)
                git push "https://x-access-token:${GH_PAT}@github.com/${REPO}.git" "$BRANCH"
                echo "Successfully updated $REPO ($BRANCH)"
              else
                echo "No changes detected in $REPO."
              fi
            else
              echo "::warning::fnpack.json not found in $REPO."
            fi
            
            popd > /dev/null
          done


