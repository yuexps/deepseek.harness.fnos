name: Build and Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布到 GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  FNPACK_BIN: fnpack-1.2.3-linux-amd64
  BIN_NAME: deepseek.harness

jobs:
  build-and-release:
    name: Package and Release FPK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Compile Go Binaries (amd64 & arm64)
        run: |
          mkdir -p /tmp/gobins
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/gobins/${{ env.BIN_NAME }}-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/gobins/${{ env.BIN_NAME }}-arm64 .

      - name: Build All FPK Packages (Parallel)
        run: |
          cp -r fnpack fnpack_base
          rm -f fnpack_base/*.fpk

          # 1. 打包 x86 安装包
          (
            mkdir -p fnpack_x86/app/bin
            cp -r fnpack_base/* fnpack_x86/
            cp /tmp/gobins/${{ env.BIN_NAME }}-amd64 fnpack_x86/app/bin/${{ env.BIN_NAME }}
            cd fnpack_x86
            chmod +x ${{ env.FNPACK_BIN }}
            ./${{ env.FNPACK_BIN }} build
            cd ..
            mv fnpack_x86/${{ env.BIN_NAME }}.fpk ./${{ env.BIN_NAME }}-x86.fpk
            rm -rf fnpack_x86
            echo "x86 FPK built successfully."
          ) &
          PID_X86=$!

          # 2. 打包 ARM 安装包
          (
            mkdir -p fnpack_arm/app/bin
            cp -r fnpack_base/* fnpack_arm/
            cp /tmp/gobins/${{ env.BIN_NAME }}-arm64 fnpack_arm/app/bin/${{ env.BIN_NAME }}
            sed -i 's/platform[[:space:]]*=[[:space:]]*x86/platform              = arm/g' fnpack_arm/manifest
            cd fnpack_arm
            chmod +x ${{ env.FNPACK_BIN }}
            ./${{ env.FNPACK_BIN }} build
            cd ..
            mv fnpack_arm/${{ env.BIN_NAME }}.fpk ./${{ env.BIN_NAME }}-arm.fpk
            rm -rf fnpack_arm
            echo "ARM FPK built successfully."
          ) &
          PID_ARM=$!

          FAIL=0
          for pid in $PID_X86 $PID_ARM; do
            wait $pid || FAIL=1
          done

          if [ $FAIL -ne 0 ]; then
            echo "Error: One or more FPK build tasks failed."
            exit 1
          fi

      - name: Extract Manifest Version
        id: manifest
        run: |
          APP_VER=$(grep -E '^[[:space:]]*version[[:space:]]*=' fnpack/manifest | awk -F'=' '{gsub(/[ \t]/,"",$2); print $2}')
          echo "version=$APP_VER" >> $GITHUB_OUTPUT

      - name: Upload x86 FPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-x86
          path: ./${{ env.BIN_NAME }}-x86.fpk
          if-no-files-found: error

      - name: Upload ARM FPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-arm
          path: ./${{ env.BIN_NAME }}-arm.fpk
          if-no-files-found: error

      - name: Generate Changelog and Release Body
        run: |
          CURR_TAG="v${{ steps.manifest.outputs.version }}"
          
          git fetch --tags --force 2>/dev/null || true
          PREV_TAG=$(git tag -l "v*" --sort=-v:refname | grep -E '^v[0-9]' | grep -v "^${CURR_TAG}$" | head -n 1)
          
          echo "Current Tag: $CURR_TAG"
          echo "Previous Tag: $PREV_TAG"
          
          {
            echo "### 安装包说明"
            echo ""
            echo "| 文件名 | 架构 |"
            echo "| :--- | :---: |"
            echo "| \`deepseek.harness-x86.fpk\` | x86_64 |"
            echo "| \`deepseek.harness-arm.fpk\` | ARM64 |"
            echo ""
            echo "---"
            echo "- 应用版本：\`${CURR_TAG}\`"
            echo ""
            echo "### 更新日志"
            echo ""
          } > release_body.md

          HAS_COMMITS=0
          if [ -n "$PREV_TAG" ]; then
            if [ -n "$(git log "${PREV_TAG}..HEAD" --no-merges --oneline)" ]; then
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"* %s (%h)" >> release_body.md
              HAS_COMMITS=1
            fi
          else
            if [ -n "$(git log HEAD --no-merges --oneline)" ]; then
              git log HEAD --no-merges --pretty=format:"* %s (%h)" -n 20 >> release_body.md
              HAS_COMMITS=1
            fi
          fi
          
          if [ $HAS_COMMITS -eq 0 ]; then
            echo "* 维护与细节优化" >> release_body.md
          fi

          if [ -n "$PREV_TAG" ]; then
            echo "" >> release_body.md
            echo "" >> release_body.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURR_TAG}" >> release_body.md
          fi

          echo "Generated release body:"
          cat release_body.md

      - name: Delete Existing Release and Tag (if exists)
        if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.manifest.outputs.version }}"
          echo "Checking if release $TAG_NAME already exists..."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG_NAME..."
            gh release delete "$TAG_NAME" --yes --cleanup-tag || true
          fi
          git push --delete origin "$TAG_NAME" 2>/dev/null || true
          git tag -d "$TAG_NAME" 2>/dev/null || true

      - name: Create GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.manifest.outputs.version }}"
          name: "Release v${{ steps.manifest.outputs.version }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          make_latest: true
          preserve_order: true
          files: |
            ${{ env.BIN_NAME }}-x86.fpk
            ${{ env.BIN_NAME }}-arm.fpk

      - name: Update FnDepot fnpack.json
        if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VERSION: ${{ steps.manifest.outputs.version }}
          TAG_NAME: v${{ steps.manifest.outputs.version }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "未配置 GH_PAT secret，跳过更新 FnDepot。"
            exit 0
          fi

          X86_SIZE=$(stat -c %s "${{ env.BIN_NAME }}-x86.fpk")
          ARM_SIZE=$(stat -c %s "${{ env.BIN_NAME }}-arm.fpk")
          X86_SHA256=$(sha256sum "${{ env.BIN_NAME }}-x86.fpk" | awk '{print $1}')
          ARM_SHA256=$(sha256sum "${{ env.BIN_NAME }}-arm.fpk" | awk '{print $1}')
          
          X86_URL="https://github.com/yuexps/deepseek.harness.fnos/releases/download/${TAG_NAME}/${{ env.BIN_NAME }}-x86.fpk"
          ARM_URL="https://github.com/yuexps/deepseek.harness.fnos/releases/download/${TAG_NAME}/${{ env.BIN_NAME }}-arm.fpk"

          PREV_TAG=$(git tag -l "v*" --sort=-v:refname | grep -E '^v[0-9]' | grep -v "^${TAG_NAME}$" | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"%s")
          else
            COMMITS=$(git log HEAD --no-merges --pretty=format:"%s" -n 20)
          fi
          # 合并为单行，避免依赖前端换行渲染
          CHANGELOG=$(printf '%s\n' "$COMMITS" | awk 'NF { printf "%s%s", sep, $0; sep="；" }')
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="解决了一些已知问题。"
          fi
          
          TARGET_REPOS=("yuexps/FnDepot")

          for REPO in "${TARGET_REPOS[@]}"; do
            echo "----------------------------------------"
            echo "Processing: $REPO"
            REPO_DIR="repo_$(echo "$REPO" | tr '/' '_')"
            
            git clone "https://x-access-token:${GH_PAT}@github.com/${REPO}.git" "$REPO_DIR" || {
              echo "::warning::Clone $REPO failed, skipping."
              continue
            }
            
            pushd "$REPO_DIR" > /dev/null
            
            if [ -f "fnpack.json" ]; then
              jq --arg ver "$VERSION" \
                 --arg x86_url "$X86_URL" \
                 --arg x86_sha "$X86_SHA256" \
                 --argjson x86_size "$X86_SIZE" \
                 --arg arm_url "$ARM_URL" \
                 --arg arm_sha "$ARM_SHA256" \
                 --argjson arm_size "$ARM_SIZE" \
                 --arg changelog "$CHANGELOG" \
                 '
                 .apps["deepseek.harness"].releases[$ver] = {
                   "packages": {
                     "x86": {
                       "download_url": $x86_url,
                       "sha256": $x86_sha,
                       "size": $x86_size,
                       "changelog": $changelog
                     },
                     "arm": {
                       "download_url": $arm_url,
                       "sha256": $arm_sha,
                       "size": $arm_size,
                       "changelog": $changelog
                     }
                   }
                 }
                 ' fnpack.json > fnpack.json.tmp && mv fnpack.json.tmp fnpack.json
                 
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              
              git add fnpack.json
              if ! git diff --staged --quiet; then
                git commit -m "chore: bump deepseek.harness to ${VERSION}"
                BRANCH=$(git rev-parse --abbrev-ref HEAD)
                git push "https://x-access-token:${GH_PAT}@github.com/${REPO}.git" "$BRANCH"
                echo "Successfully updated $REPO ($BRANCH)"
              else
                echo "No changes detected in $REPO."
              fi
            else
              echo "::warning::fnpack.json not found in $REPO."
            fi
            
            popd > /dev/null
          done
