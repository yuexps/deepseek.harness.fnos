          sudo rm -rf /etc/apt/sources.list.d/* /etc/apt/sources.list /etc/apt/apt-mirrors.txt
          ARCH=$(dpkg --print-architecture)
          if [ "$ARCH" = "arm64" ]; then
            MIRROR_URL="http://ports.ubuntu.com/ubuntu-ports/"
            SEC_URL="http://ports.ubuntu.com/ubuntu-ports/"
          else
            MIRROR_URL="http://archive.ubuntu.com/ubuntu/"
            SEC_URL="http://security.ubuntu.com/ubuntu/"
          fi
          sudo tee /etc/apt/sources.list.d/ubuntu.sources <<EOF
          Types: deb
          URIs: $MIRROR_URL
          Suites: noble noble-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: $SEC_URL
          Suites: noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update -o Acquire::http::Timeout="10" -o Acquire::Retries="2"
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Clone Upstream Harness
        run: |
          mkdir -p /tmp/upstream
          git clone --depth=1 https://github.com/deepseek-ai/deepseek-harness.git /tmp/upstream/deepseek-harness
          cd /tmp/upstream/deepseek-harness
          # 启用 Git 稀疏检出，排除非编译运行时目录（docs、examples、assets、python 等）
          git sparse-checkout set packages apps vendor native patches scripts website

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-harness-${{ hashFiles('/tmp/upstream/deepseek-harness/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-harness-

      - name: Prebuild Upstream Harness (arm64)
        run: |
          # 执行完整构建并编译 Landlock 原生沙箱组件
          cd /tmp/upstream/deepseek-harness
          pnpm install --no-frozen-lockfile
          pnpm run build
          cd native/landlock-run
          pnpm run build:native
          cd ../..
          
          # 清理构建增量缓存
          find . -name "*.tsbuildinfo" -delete
          
          # 动态闭包剪枝：从 @deepseek-ai/dsh (apps/cli) 递归分析依赖图，动态清理未被引用的 dev 子包
          node - <<'NODE'
          const fs = require('fs'), path = require('path')
          function readP(p) { try { return JSON.parse(fs.readFileSync(p, 'utf8')) } catch { return null } }
          const allMembers = new Map()
          function collect(dir) {
            if (!fs.existsSync(dir)) return
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              if (!e.isDirectory() || e.name === 'node_modules' || e.name === '.git' ||
                  e.name === 'fixtures' || e.name === 'tests') continue
              const sub = path.join(dir, e.name)
              const pj = path.join(sub, 'package.json')
              if (fs.existsSync(pj)) {
                const p = readP(pj)
                if (p && p.name) allMembers.set(p.name, sub)
              }
              collect(sub)
            }
          }
          for (const r of ['packages', 'apps', 'vendor', 'native']) collect(r)

          const used = new Set()
          function visit(name) {
            if (used.has(name)) return
            used.add(name)
            const dir = allMembers.get(name)
            if (!dir) return
            const p = readP(path.join(dir, 'package.json'))
            if (!p) return
            for (const k of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
              if (!p[k]) continue
              for (const dep in p[k]) if (allMembers.has(dep)) visit(dep)
            }
          }
          visit('@deepseek-ai/dsh')

          let removed = 0
          for (const [name, dir] of allMembers) {
            if (used.has(name)) continue
            if (dir.includes('/fixtures/') || dir.includes('/tests/')) continue
            if (name.includes('landlock-run-workspace') || dir.startsWith('native/landlock-run/packages/')) continue
            fs.rmSync(dir, { recursive: true, force: true })
            removed++
            console.log('rm unused member:', dir, '[' + name + ']')
          }
          console.log('wave4: removed ' + removed + ' unused workspace members')
          NODE
          
          # 清理根和保留 member 的 scripts 与 devDependencies
          node - <<'NODE'
          const fs = require('fs'), path = require('path')
          {
            const p = './package.json'
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'))
            pkg.scripts = {}
            delete pkg.devDependencies
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n')
          }
          function stripMember(dir) {
            if (!fs.existsSync(dir)) return
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              if (!e.isDirectory() || e.name === 'node_modules' || e.name === '.git') continue
              const sub = path.join(dir, e.name)
              const pj = path.join(sub, 'package.json')
              if (fs.existsSync(pj)) {
                const pkg = JSON.parse(fs.readFileSync(pj, 'utf8'))
                let touched = false
                if (pkg.scripts && Object.keys(pkg.scripts).length) { pkg.scripts = {}; touched = true }
                if (pkg.devDependencies) { delete pkg.devDependencies; touched = true }
                if (touched) fs.writeFileSync(pj, JSON.stringify(pkg, null, 2) + '\n')
              }
              stripMember(sub)
            }
          }
          for (const root of ['packages', 'apps', 'vendor']) stripMember(root)
          NODE
          
          # 重装纯生产依赖（仅为核心闭包安装依赖）
          rm -rf node_modules
          CI=true pnpm install --prod \
            --no-frozen-lockfile \
            --config.confirmModulesPurge=false \
            --config.dangerouslyAllowAllBuilds=true \
            --config.minimumReleaseAge=0 \
            --config.strictDepBuilds=false
          
          node packages/subprocess/subprocess-local/scripts/ensure-spawn-helper.mjs || true
          
          cd /tmp/upstream
          tar --numeric-owner -czf /tmp/deepseek-harness-arm64.tar.gz deepseek-harness

      - name: Upload arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-arm64
          path: /tmp/deepseek-harness-arm64.tar.gz

  build-and-release:
    name: Package and Release
    needs: [build-harness-amd64, build-harness-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download amd64 and Source Artifacts
        uses: actions/download-artifact@v4
        with:
          name: harness-amd64
          path: /tmp/amd64-dist

      - name: Download arm64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: harness-arm64
          path: /tmp/arm64-dist

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Compile Go Binaries
        run: |
          mkdir -p /tmp/gobins
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/gobins/${{ env.BIN_NAME }}-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/gobins/${{ env.BIN_NAME }}-arm64 .

      - name: Build All FPK Packages (Parallel)
        run: |
          # 1. x86 预构建版
          (
            mkdir -p fnpack_x86_prebuilt/app/bin
            cp -r fnpack/* fnpack_x86_prebuilt/
            echo "prebuilt" > fnpack_x86_prebuilt/app/.pkg_type
            cp /tmp/amd64-dist/version.txt fnpack_x86_prebuilt/app/.version
            cp /tmp/amd64-dist/deepseek-harness-amd64.tar.gz fnpack_x86_prebuilt/app/deepseek-harness.tar.gz
            cp /tmp/gobins/${{ env.BIN_NAME }}-amd64 fnpack_x86_prebuilt/app/bin/${{ env.BIN_NAME }}
            cd fnpack_x86_prebuilt
            chmod +x ${{ env.FNPACK_BIN }}
            ./${{ env.FNPACK_BIN }} build
            cd ..
            mv fnpack_x86_prebuilt/${{ env.BIN_NAME }}.fpk ./${{ env.BIN_NAME }}-x86-prebuilt.fpk
            rm -rf fnpack_x86_prebuilt
            echo "x86-prebuilt FPK built successfully."
          ) &
          PID_X86_PREBUILT=$!

          # 2. arm 预构建版
          (
            mkdir -p fnpack_arm_prebuilt/app/bin
            cp -r fnpack/* fnpack_arm_prebuilt/
            echo "prebuilt" > fnpack_arm_prebuilt/app/.pkg_type
            cp /tmp/amd64-dist/version.txt fnpack_arm_prebuilt/app/.version
            cp /tmp/arm64-dist/deepseek-harness-arm64.tar.gz fnpack_arm_prebuilt/app/deepseek-harness.tar.gz
            cp /tmp/gobins/${{ env.BIN_NAME }}-arm64 fnpack_arm_prebuilt/app/bin/${{ env.BIN_NAME }}
            sed -i 's/platform[[:space:]]*=[[:space:]]*x86/platform              = arm/g' fnpack_arm_prebuilt/manifest
            cd fnpack_arm_prebuilt
            chmod +x ${{ env.FNPACK_BIN }}
            ./${{ env.FNPACK_BIN }} build
            cd ..
            mv fnpack_arm_prebuilt/${{ env.BIN_NAME }}.fpk ./${{ env.BIN_NAME }}-arm-prebuilt.fpk
            rm -rf fnpack_arm_prebuilt
            echo "ARM-prebuilt FPK built successfully."
          ) &
          PID_ARM_PREBUILT=$!

          # 3. x86 源码版
          (
            mkdir -p fnpack_x86_source/app/bin
            cp -r fnpack/* fnpack_x86_source/
            echo "source" > fnpack_x86_source/app/.pkg_type
            cp /tmp/amd64-dist/version.txt fnpack_x86_source/app/.version
            cp /tmp/amd64-dist/deepseek-harness-source.tar.gz fnpack_x86_source/app/deepseek-harness.tar.gz
            cp /tmp/gobins/${{ env.BIN_NAME }}-amd64 fnpack_x86_source/app/bin/${{ env.BIN_NAME }}
            cd fnpack_x86_source
            chmod +x ${{ env.FNPACK_BIN }}
            ./${{ env.FNPACK_BIN }} build
            cd ..
            mv fnpack_x86_source/${{ env.BIN_NAME }}.fpk ./${{ env.BIN_NAME }}-x86.fpk
            rm -rf fnpack_x86_source
            echo "x86-source FPK built successfully."
          ) &
          PID_X86_SOURCE=$!

          # 4. arm 源码版
          (
            mkdir -p fnpack_arm_source/app/bin
            cp -r fnpack/* fnpack_arm_source/
            echo "source" > fnpack_arm_source/app/.pkg_type
            cp /tmp/amd64-dist/version.txt fnpack_arm_source/app/.version
            cp /tmp/amd64-dist/deepseek-harness-source.tar.gz fnpack_arm_source/app/deepseek-harness.tar.gz
            cp /tmp/gobins/${{ env.BIN_NAME }}-arm64 fnpack_arm_source/app/bin/${{ env.BIN_NAME }}
            sed -i 's/platform[[:space:]]*=[[:space:]]*x86/platform              = arm/g' fnpack_arm_source/manifest
            cd fnpack_arm_source
            chmod +x ${{ env.FNPACK_BIN }}
            ./${{ env.FNPACK_BIN }} build
            cd ..
            mv fnpack_arm_source/${{ env.BIN_NAME }}.fpk ./${{ env.BIN_NAME }}-arm.fpk
            rm -rf fnpack_arm_source
            echo "ARM-source FPK built successfully."
          ) &
          PID_ARM_SOURCE=$!

          # 等待所有后台任务并捕获失败退出码
          FAIL=0
          for pid in $PID_X86_PREBUILT $PID_ARM_PREBUILT $PID_X86_SOURCE $PID_ARM_SOURCE; do
            wait $pid || FAIL=1
          done

          if [ $FAIL -ne 0 ]; then
            echo "Error: One or more FPK build tasks failed."
            exit 1
          fi

      - name: Extract Manifest Version
        id: manifest
        run: |
          APP_VER=$(grep -E '^[[:space:]]*version[[:space:]]*=' fnpack/manifest | awk -F'=' '{gsub(/[ \t]/,"",$2); print $2}')
          UPSTREAM_VER=$(cat /tmp/amd64-dist/version.txt 2>/dev/null || echo "latest")
          echo "version=$APP_VER" >> $GITHUB_OUTPUT
          echo "upstream_ver=$UPSTREAM_VER" >> $GITHUB_OUTPUT
          echo "Release version: $APP_VER, Upstream version: $UPSTREAM_VER"

      - name: Upload x86 Prebuilt FPK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-x86-prebuilt
          path: ./${{ env.BIN_NAME }}-x86-prebuilt.fpk
          if-no-files-found: error

      - name: Upload ARM Prebuilt FPK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-arm-prebuilt
          path: ./${{ env.BIN_NAME }}-arm-prebuilt.fpk
          if-no-files-found: error

      - name: Upload x86 Source FPK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-x86
          path: ./${{ env.BIN_NAME }}-x86.fpk
          if-no-files-found: error

      - name: Upload ARM Source FPK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-arm
          path: ./${{ env.BIN_NAME }}-arm.fpk
          if-no-files-found: error

      - name: Delete Existing Release and Tag (if exists)
        if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.manifest.outputs.version }}"
          echo "Checking if release $TAG_NAME already exists..."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG_NAME..."
            gh release delete "$TAG_NAME" --yes --cleanup-tag || true
          fi
          git push --delete origin "$TAG_NAME" 2>/dev/null || true
          git tag -d "$TAG_NAME" 2>/dev/null || true

      - name: Create GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.manifest.outputs.version }}"
          name: "Release v${{ steps.manifest.outputs.version }}"
          body: |
            ### 安装包版本说明

            | 文件名 | 架构 | 类型 | 说明 |
            | :--- | :---: | :---: | :--- |
            | `deepseek.harness-x86-prebuilt.fpk` | x86_64 | 预构建版 | 内置前端产物、后端编译文件及运行时依赖，安装后直接启动服务。 |
            | `deepseek.harness-arm-prebuilt.fpk` | ARM64 | 预构建版 | 内置前端产物、后端编译文件及运行时依赖，安装后直接启动服务。 |
            | `deepseek.harness-x86.fpk` | x86_64 | 源码版 | 仅包含项目源码，首次安装启动时在本地自动下载依赖并执行构建。 |
            | `deepseek.harness-arm.fpk` | ARM64 | 源码版 | 仅包含项目源码，首次安装启动时在本地自动下载依赖并执行构建。 |

            ---
            - 应用版本：`v${{ steps.manifest.outputs.version }}`
            - 上游源码版本：`${{ steps.manifest.outputs.upstream_ver }}`
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ${{ env.BIN_NAME }}-x86-prebuilt.fpk
            ${{ env.BIN_NAME }}-arm-prebuilt.fpk
            ${{ env.BIN_NAME }}-x86.fpk
            ${{ env.BIN_NAME }}-arm.fpk

      - name: Update FnDepot fnpack.json
        if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VERSION: ${{ steps.manifest.outputs.version }}
          TAG_NAME: v${{ steps.manifest.outputs.version }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "未配置 GH_PAT secret，跳过更新 FnDepot。"
            exit 0
          fi

          # 1. 计算安装包大小 (MB, 保留一位小数，均以 x86 为准)
          PREBUILT_SIZE=$(ls -l --block-size=1 "${{ env.BIN_NAME }}-x86-prebuilt.fpk" | awk '{printf "%.1f", $5/1024/1024}')
          SOURCE_SIZE=$(ls -l --block-size=1 "${{ env.BIN_NAME }}-x86.fpk" | awk '{printf "%.1f", $5/1024/1024}')
          
          # 2. 构造下载链接
          PREBUILT_X86_URL="https://github.com/yuexps/deepseek.harness.fnos/releases/download/${TAG_NAME}/${{ env.BIN_NAME }}-x86-prebuilt.fpk"
          PREBUILT_ARM_URL="https://github.com/yuexps/deepseek.harness.fnos/releases/download/${TAG_NAME}/${{ env.BIN_NAME }}-arm-prebuilt.fpk"
          
          SOURCE_X86_URL="https://github.com/yuexps/deepseek.harness.fnos/releases/download/${TAG_NAME}/${{ env.BIN_NAME }}-x86.fpk"
          SOURCE_ARM_URL="https://github.com/yuexps/deepseek.harness.fnos/releases/download/${TAG_NAME}/${{ env.BIN_NAME }}-arm.fpk"
          
          # 3. 待同步更新的目标仓库列表
          TARGET_REPOS=("yuexps/FnDepot" "shuangji66/FnDepot")

          for REPO in "${TARGET_REPOS[@]}"; do
            echo "----------------------------------------"
            echo "Processing: $REPO"
            REPO_DIR="repo_$(echo "$REPO" | tr '/' '_')"
            
            # yuexps/FnDepot 对应源码版，shuangji66/FnDepot 对应预构建版
            if [ "$REPO" = "yuexps/FnDepot" ]; then
              APP_SIZE="$SOURCE_SIZE"
              X86_URL="$SOURCE_X86_URL"
              ARM_URL="$SOURCE_ARM_URL"
            else
              APP_SIZE="$PREBUILT_SIZE"
              X86_URL="$PREBUILT_X86_URL"
              ARM_URL="$PREBUILT_ARM_URL"
            fi
            
            echo "Updating $REPO -> Version: $VERSION, Size: $APP_SIZE"
            
            # 克隆目标仓库
            git clone "https://x-access-token:${GH_PAT}@github.com/${REPO}.git" "$REPO_DIR" || {
              echo "::warning::Clone $REPO failed, skipping."
              continue
            }
            
            pushd "$REPO_DIR" > /dev/null
            
            if [ -f "fnpack.json" ]; then
              # 使用 jq 精确修改 deepseek.harness 对应字段
              jq --arg ver "$VERSION" \
                 --arg size "$APP_SIZE" \
                 --arg x86_url "$X86_URL" \
                 --arg arm_url "$ARM_URL" \
                 '
                 .["deepseek.harness"].version = $ver |
                 .["deepseek.harness"].size = $size |
                 .["deepseek.harness"].arch_diff.x86.download_url = $x86_url |
                 .["deepseek.harness"].arch_diff.arm.download_url = $arm_url
                 ' fnpack.json > fnpack.json.tmp && mv fnpack.json.tmp fnpack.json
                 
              # 配置 Git 信息并提交推送
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              
              git add fnpack.json
              if ! git diff --staged --quiet; then
                git commit -m "chore: bump deepseek.harness to ${VERSION}"
                BRANCH=$(git rev-parse --abbrev-ref HEAD)
                git push "https://x-access-token:${GH_PAT}@github.com/${REPO}.git" "$BRANCH"
                echo "Successfully updated $REPO ($BRANCH)"
              else
                echo "No changes detected in $REPO."
              fi
            else
              echo "::warning::fnpack.json not found in $REPO."
            fi
            
            popd > /dev/null
          done


